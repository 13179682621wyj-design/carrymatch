async function pollChat(){

async function run(fn){try{error='';success='';await fn()}catch(e){error=e.message||String(e);view()}}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){const switching=(page==='inbox'&&b.dataset.page==='requests')||(page==='requests'&&b.dataset.page==='inbox');if(switching){page=b.dataset.page;error='';success='';view();if(page==='inbox')loadInboxPreviews().catch(e=>console.warn('会话预览加载失败',e));return;}return go(b.dataset.page);}if(b.dataset.avatar){let field=$('#avatar_key');if(field){field.value=b.dataset.avatar;document.querySelectorAll('[data-avatar]').forEach(x=>x.classList.toggle('selected',x.dataset.avatar===b.dataset.avatar))}return;}if(b.id==='account')return go('identity');if(b.dataset.start){kind=b.dataset.start;return go('post')}if(b.dataset.kind){kind=b.dataset.kind;return view()}if(b.dataset.action==='edit-profile'){profileEditing=!profileEditing;return view()}if(b.dataset.action==='auth')return;if(b.dataset.action==='new')return go('post');if(b.dataset.action==='refresh-inbox')return run(async()=>{await refresh();await loadInboxPreviews()});if(b.dataset.action==='refresh')return run(async()=>{if(!user)await init();else await refresh()});if(b.dataset.delete)return run(async()=>{if(!confirm('确定删除这条发布吗？'))return;await q(db.from('posts').delete().eq('id',b.dataset.delete));await refresh()});if(b.dataset.request)return run(async()=>{const [p_need,p_trip]=b.dataset.request.split('|');await q(db.rpc('cm_request_contact',{p_need,p_trip}));await refresh();success='已发出联系申请';view()});if(b.dataset.respond)return run(async()=>{const [p_request,v]=b.dataset.respond.split('|');await q(db.rpc('cm_respond_contact',{p_request,p_accept:v==='yes'}));await refresh();success='已处理联系申请';view()});if(b.dataset.chat)return run(async()=>{currentChat=b.dataset.chat;chatMessages=await q(db.rpc('cm_my_messages',{p_request:currentChat}));go('chat');pollChat()});if(b.dataset.read)return run(async()=>{await q(db.from('notifications').update({read_at:new Date().toISOString()}).eq('id',b.dataset.read));await refresh()})});document.addEventListener('submit',e=>{e.preventDefault();run(async()=>{let f=new FormData(e.target);if(e.target.id==='chat-form'){if(!currentChat)throw Error('请先选择聊天');await q(db.rpc('cm_send_message',{p_request:currentChat,p_content:String(f.get('content')||'')}));chatMessages=await q(db.rpc('cm_my_messages',{p_request:currentChat}));view();return;}if(e.target.id==='profile-form'){if(!user)throw Error('请等待匿名身份建立');const nickname=String(f.get('nickname')||'').trim(),avatar_key=String(f.get('avatar_key')||'postman'),bio=String(f.get('bio')||'').trim();if(nickname.length<2||nickname.length>24||!AVATARS[avatar_key])throw Error('请填写有效昵称并选择头像');const updated=await q(db.from('profiles').update({nickname,avatar_key,avatar:avatar_key,bio}).eq('id',user.id).select('*').single());profile={...updated,avatar_key:updated.avatar_key||updated.avatar||'cloud'};profileEditing=false;success='个人资料已保存';return view()}if(e.target.id==='login'){await q(db.auth.signInWithOtp({email:String(f.get('email')),options:{emailRedirectTo:location.origin+location.pathname}}));success='邮件已发送，请查收并在浏览器中打开登录链接。';return view()}if(e.target.id==='publish'){if(!user)throw Error('匿名会话尚未建立，请稍后重试');const val=k=>String(f.get(k)||'').trim();const origin_country=val('origin_country'),origin_city=val('origin_city'),destination_country=val('destination_country'),destination_city=val('destination_city'),date=val('date'),weight=Number(f.get('weight'));if(!origin_country||!origin_city||!destination_country||!destination_city||!date||!Number.isFinite(weight)||weight<=0||weight>100)throw Error('请填写完整的路线、日期和重量');if(date<new Date().toLocaleDateString('en-CA'))throw Error('日期不能早于今天');const origin=origin_country+' '+origin_city,destination=destination_country+' '+destination_city;let item={owner:user.id,kind,origin,destination,origin_country,origin_city,destination_country,destination_city,description:val('description'),item_category:kind==='need'?val('category'):null,status:'active',visibility:'private',forwarding:f.has('destination_shipping'),travel_date:kind==='trip'?date:null,latest_delivery_date:kind==='need'?date:null,weight_kg:kind==='need'?weight:null,available_kg:kind==='trip'?weight:null,accepts_domestic_forwarding:kind==='trip'&&f.has('destination_shipping'),accepts_domestic_parcels:false,accepts_origin_shipping:kind==='need'&&f.has('origin_shipping'),accepts_destination_shipping:kind==='need'&&f.has('destination_shipping'),traveler_accepts_origin_shipping:kind==='trip'&&f.has('origin_shipping'),traveler_accepts_destination_shipping:kind==='trip'&&f.has('destination_shipping')};await q(db.from('posts').insert(item));await refresh();go('mine');let first=false;try{const k='cm-first-publish-hint-'+user.id;first=!localStorage.getItem(k);if(first)localStorage.setItem(k,'1')}catch(_){}success=first?'发布成功！关闭页面后用同一浏览器再次打开，通常仍能看到记录；清除网站数据或换设备可能无法恢复匿名身份。':'发布成功。匹配只会发生在不同用户之间。';view()}})});async function ensureProfile(){if(!user)return;const {data:existing,error:fetchError}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(fetchError)throw fetchError;if(existing){profile={...existing,avatar_key:existing.avatar_key||existing.avatar||'cloud'};return;}const bytes=new Uint32Array(1);if(window.crypto?.getRandomValues)window.crypto.getRandomValues(bytes);else bytes[0]=Math.floor(Math.random()*4294967295);const n=bytes[0]%NAMES.length;const {data:created,error:insertError}=await db.from('profiles').insert({id:user.id,nickname:NAMES[n],avatar_key:Object.keys(AVATARS)[n],avatar:Object.keys(AVATARS)[n],bio:''}).select('*').single();if(insertError){const {data:retry,error:retryError}=await db.from('profiles').select('*').eq('id',user.id).single();if(retryError)throw insertError;profile={...retry,avatar_key:retry.avatar_key||retry.avatar||'cloud'};}else profile={...created,avatar_key:created.avatar_key||created.avatar||'cloud'};}async function init(){view();if(!db)return;try{const {data:existing,error:e}=await db.auth.getSession();if(e)throw e;let session=existing?.session;if(!session){const {data:created,error:signError}=await db.auth.signInAnonymously();if(signError)throw signError;session=created.session;}user=session?.user||null;if(user){await ensureProfile();await refresh();}db.auth.onAuthStateChange((_event,session)=>{if(session?.user?.id!==user?.id){user=session?.user||null;setTimeout(()=>{if(user)ensureProfile().then(refresh).catch(err=>{error=err.message;view()});else{posts=[];notices=[];profile=null;go('home')}},0)}});view()}catch(e){error=e.message;view()}}init();})();
</script></body></html>
